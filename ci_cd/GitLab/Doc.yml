
.BuildDoc_rules: &BuildDoc_rules
  - changes:
    - CMakeLists.txt
    - conanfile.py
    - libs/**/*
    - dox/**/*
    - .gitlab-ci.yml
    - ci_cd/GitLab/*
    when: on_success
  - if: $CI_COMMIT_TAG
    when: on_success
  - when: never


include:
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/BuildApiDoc@0.0.22
    inputs:
      build_command: 'doxygen'
      rules: *BuildDoc_rules


pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  dependencies:
    - BuildApiDoc
  script:
    - mkdir public
    - mv build/doc/html/* public/
  artifacts:
    paths:
      - public
